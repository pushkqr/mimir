<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MahaGov Officer Portal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M2.5 16.88a1 1 0 0 1-.32-1.43l9-13.02a1 1 0 0 1 1.64 0l9 13.01a1 1 0 0 1-.32 1.44l-8.51 4.86a2 2 0 0 1-1.98 0Z'/><path d='M12 2v20'/></svg>">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body{font-family:'Geist',system-ui,sans-serif}
  html{scroll-behavior:smooth;font-size:19px}
  .serif{font-family:'Instrument Serif','Spectral',Georgia,serif;font-weight:400}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .lx{animation:fadein .35s ease both}
  #demo{transition:opacity .45s ease}
  .mono{font-family:'Geist Mono',ui-monospace,monospace}
  .lc-rail{position:absolute;height:2px;border-radius:2px;background:currentColor}
  .lc-fill{position:absolute;height:2px;width:0;border-radius:2px;background:linear-gradient(90deg,#f59e0b,#eab308);box-shadow:0 0 8px rgba(245,158,11,.5);transition:width .1s linear}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #f59e0b;outline-offset:2px;border-radius:5px}
  .lc-dot{background:#cbd5e1;transition:background .3s ease,box-shadow .3s ease}
  .dark .lc-dot{background:#334155}
  .lc-stage.lit .lc-dot{background:#f59e0b;box-shadow:0 0 0 4px rgba(245,158,11,.15)}
  .lc-dot-hero{position:relative}
  .lc-dot-hero::after{content:"";position:absolute;inset:0;border-radius:9999px;background:#f59e0b;animation:lcping 2.2s ease-out infinite}
  @keyframes lcping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.4);opacity:0}}
  @media (prefers-reduced-motion:reduce){.lc-dot-hero::after{animation:none}.mimir-mark{animation:none}.wv-f,.wv-b{animation:none}}
  .wv{position:absolute;top:0;left:0;height:100%;width:200%}
  .wv-f{animation:wflow 16s linear infinite}
  .wv-b{animation:wflow 26s linear infinite}
  @keyframes wflow{to{transform:translateX(-50%)}}
  @keyframes lshimmer{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(-22deg)}}
  .card{position:relative;background-image:radial-gradient(240px circle at var(--mx,-200px) var(--my,-200px), rgba(245,158,11,.16), transparent 60%);background-color:rgba(255,255,255,.78)}
  .dark .card{background-color:rgba(14,20,32,.66)}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
  .reveal.in{opacity:1;transform:none}
  /* staggered scroll-reveal: a container's children cascade in one by one (--i set per child in JS) */
  .stg>*{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,border-color .35s ease}
  .stg.in>*{opacity:1;transform:none;transition-delay:calc(var(--i,0)*80ms)}
  /* tactile hover-lift on cards (rounded-2xl/3xl only, so flow arrows are excluded) — elevation via shadow+border, no transform conflict with the reveal */
  .stg.in>.rounded-2xl:hover,.stg.in>.rounded-3xl:hover{transition-delay:0s;box-shadow:0 22px 55px -26px rgba(2,8,20,.6);border-color:rgba(245,158,11,.5)}
  /* benchmark proof bars grow in on reveal */
  .evbar-fill{width:0;transition:width 1.05s cubic-bezier(.22,1,.36,1) .15s}
  @media (prefers-reduced-motion:reduce){.reveal,.stg>*{opacity:1!important;transform:none!important;transition:none}.evbar-fill{transition:none}}
  /* signature scroll moment — pinned scrollytelling: the forget hero plays out as you scroll */
  .scrolly{height:260vh}
  .scrolly-sticky{position:sticky;top:0;display:flex;min-height:100vh;align-items:center;padding:4rem 0}
  .scrolly.noscroll{height:auto}
  .scrolly.noscroll .scrolly-sticky{position:static;min-height:0}
  .ss-el{opacity:0;transform:translateY(12px);transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}
  .ss-el.show{opacity:1;transform:none}
  .ss-diss{display:inline-block;transition:opacity .6s ease,transform .6s ease,filter .6s ease}
  .ss-diss.gone{opacity:0;transform:translateY(8px) scale(.82);filter:blur(5px)}
  #srail [data-s]{transition:color .35s ease,opacity .35s ease;opacity:.55}
  #srail [data-s].on{color:#f59e0b;opacity:1}
  .srail-line{flex:1;height:1px;margin:0 10px;background:currentColor;opacity:.2}
  #ssQ.reask>div{box-shadow:0 0 0 2px rgba(245,158,11,.55);transition:box-shadow .35s ease}
  @media (prefers-reduced-motion:reduce){.ss-el,.ss-diss{transition:none}}
  .grad{background:linear-gradient(90deg,#d97706,#ca8a04);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .dark .grad{background:linear-gradient(90deg,#f59e0b,#eab308);-webkit-background-clip:text;background-clip:text}
  .mimir-mark{font-weight:400;line-height:.82;letter-spacing:-.02em;font-size:clamp(5rem,29vw,24rem);margin-bottom:-.06em;background:linear-gradient(180deg,#d97706 0%,#ca8a04 46%,rgba(217,119,6,0) 88%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:lshimmer 7s ease-in-out infinite}
  .dark .mimir-mark{background:linear-gradient(180deg,#f59e0b 0%,#eab308 46%,rgba(99,102,241,0) 88%);-webkit-background-clip:text;background-clip:text}
  .bg-grid{background-image:radial-gradient(rgba(100,116,139,.13) 1px,transparent 1px);background-size:26px 26px}
  .dark .bg-grid{background-image:radial-gradient(rgba(148,163,184,.07) 1px,transparent 1px)}
</style>
<style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{opacity:0;animation:rise .85s cubic-bezier(.22,1,.36,1) forwards}
@media (prefers-reduced-motion:reduce){.rise{opacity:1;animation:none}}
@keyframes wwmarq{to{transform:translateX(-50%)}}
.wwmarq{animation:wwmarq 38s linear infinite}
.wwwrap:hover .wwmarq{animation-play-state:paused}
.wwmask{-webkit-mask-image:linear-gradient(90deg,transparent,#000 11%,#000 89%,transparent);mask-image:linear-gradient(90deg,transparent,#000 11%,#000 89%,transparent)}
@media (prefers-reduced-motion:reduce){.wwmarq{animation:none}}
</style>
</head>
<body class="text-slate-900 antialiased dark:text-slate-100">
<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-zinc-950 focus:px-4 focus:py-2 focus:text-sm focus:text-white dark:focus:bg-white dark:focus:text-black">Skip to content</a>
<div aria-hidden="true" class="bg-grid fixed inset-0 -z-10 bg-[#f6f8fc] dark:bg-[#0a0e1a]"></div>
<div id="flowWave" aria-hidden="true" class="pointer-events-none fixed inset-x-0 bottom-0 -z-10 h-48 overflow-hidden" style="opacity:.14;-webkit-mask-image:linear-gradient(0deg,#000,#000 40%,transparent);mask-image:linear-gradient(0deg,#000,#000 40%,transparent)">
  <svg class="wv wv-b" viewBox="0 0 1440 90" preserveAspectRatio="none" fill="none"><path d="M0 55 Q120 30 240 55 T480 55 T720 55 T960 55 T1200 55 T1440 55" stroke="#eab308" stroke-width="2" stroke-opacity=".55" stroke-linecap="round"/></svg>
  <svg class="wv wv-f" viewBox="0 0 1440 90" preserveAspectRatio="none" fill="none"><path d="M0 44 Q120 20 240 44 T480 44 T720 44 T960 44 T1200 44 T1440 44" stroke="#f59e0b" stroke-width="2" stroke-opacity=".6" stroke-linecap="round"/></svg>
</div>

<header class="sticky top-0 z-20 border-b border-zinc-300/70 bg-[#f4f7fc]/80 backdrop-blur dark:border-zinc-900 dark:bg-[#0a0e1a]/75">
  <div class="mx-auto flex max-w-5xl items-center justify-between px-5 py-3.5">
    <div class="flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pyramid-icon lucide-pyramid text-amber-600 dark:text-amber-400"><path d="M2.5 16.88a1 1 0 0 1-.32-1.43l9-13.02a1 1 0 0 1 1.64 0l9 13.01a1 1 0 0 1-.32 1.44l-8.51 4.86a2 2 0 0 1-1.98 0Z"/><path d="M12 2v20"/></svg>
      <span class="serif text-xl leading-none tracking-tight">MahaGov Portal</span>
    </div>
    <div class="flex items-center gap-2">
      <a href="https://github.com/pushkqr/mimir/tree/main/learning" target="_blank" rel="noopener" class="mr-1 hidden text-sm font-medium text-zinc-500 transition hover:text-zinc-900 sm:inline dark:text-zinc-400 dark:hover:text-zinc-100">Learn</a>
      <button id="theme" aria-label="Toggle theme" class="grid h-8 w-8 place-items-center rounded-md border border-zinc-300 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-900">
        <svg class="block dark:hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="hidden dark:block" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
      </button>
      <a href="https://github.com/pushkqr/mimir" target="_blank" rel="noopener" aria-label="GitHub repository — code and docs" title="Code &amp; docs on GitHub" class="grid h-8 w-8 place-items-center rounded-md border border-zinc-300 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-900">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.7 5.6.7 11.9c0 5 3.2 9.3 7.7 10.8.6.1.8-.2.8-.5v-2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.7 0-1.2.4-2.2 1.2-3-.1-.3-.5-1.5.1-3 0 0 .9-.3 3.1 1.2a10.7 10.7 0 0 1 5.6 0c2.2-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .7.8 1.2 1.8 1.2 3 0 4.4-2.6 5.4-5.1 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.6.8.5 4.5-1.5 7.7-5.8 7.7-10.8C23.3 5.6 18.3.5 12 .5z"/></svg>
      </a>
      <a href="/portal" class="rounded-full bg-zinc-950 px-5 py-2 text-sm font-medium text-white transition hover:bg-zinc-800 dark:bg-white dark:text-black dark:hover:bg-zinc-200">Launch app</a>
    </div>
  </div>
</header>

<main id="main" class="min-h-screen flex items-center justify-center">
<section class="mx-auto w-full max-w-md px-5 pt-10 pb-20">
  <div class="rounded-3xl border border-zinc-200/90 bg-white/60 p-8 shadow-2xl shadow-amber-500/5 backdrop-blur dark:border-zinc-800/80 dark:bg-[#10151f]/50">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1 class="serif text-3xl tracking-tight">Officer Sign In</h1>
      <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">Authorized personnel only</p>
    </div>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="token" class="mb-1.5 block text-xs font-medium uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Access Token</label>
        <input type="password" id="token" required placeholder="Paste your token here" class="block w-full rounded-xl border border-zinc-300 bg-white/50 px-4 py-3 text-sm transition focus:border-amber-500 focus:outline-none focus:ring-4 focus:ring-amber-500/10 dark:border-zinc-700 dark:bg-zinc-900/50">
      </div>
      
      <div id="errorMsg" class="hidden rounded-lg bg-red-500/10 p-3 text-sm text-red-600 dark:text-red-400"></div>

      <button type="submit" class="mt-2 w-full rounded-xl bg-amber-500 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-amber-500/20 transition hover:-translate-y-0.5 hover:bg-amber-400 dark:bg-amber-600 dark:hover:bg-amber-500">
        Sign in to Portal &rarr;
      </button>
    </form>
  </div>
</section>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = document.getElementById('token').value.trim();
  const err = document.getElementById('errorMsg');
  
  const btn = e.target.querySelector('button');
  const ogText = btn.innerHTML;
  btn.innerHTML = 'Authenticating...';
  btn.disabled = true;
  err.classList.add('hidden');
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    
    const data = await res.json();
    if (!res.ok) {
      err.textContent = data.error || 'Authentication failed.';
      err.classList.remove('hidden');
      btn.innerHTML = ogText;
      btn.disabled = false;
      return;
    }
    
    localStorage.setItem('portal.user_id', data.token);
    localStorage.setItem('mimir.token', data.token); // to access the protected backend routes
    window.location.href = '/portal';
  } catch(e) {
    err.textContent = 'Network error. Please try again.';
    err.classList.remove('hidden');
    btn.innerHTML = ogText;
    btn.disabled = false;
  }
});
</script>

<script>
 const root=document.documentElement;
 if(localStorage.theme==='light')root.classList.remove('dark');
 document.getElementById('theme').onclick=()=>{root.classList.toggle('dark');localStorage.theme=root.classList.contains('dark')?'dark':'light';};
 document.querySelectorAll('.card').forEach(c=>{c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');});c.addEventListener('mouseleave',()=>{c.style.setProperty('--mx','-200px');c.style.setProperty('--my','-200px');});});
 document.querySelectorAll('.stg').forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty('--i',i)));
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
 document.querySelectorAll('.reveal,.stg').forEach(el=>io.observe(el));



 // flow wave — the river of Mimir: barely there at the top, grows a touch as you scroll, then fades out
 // as the footer river takes over (the merge). rAF-throttled; respects reduced-motion.
 (function(){
   const fw=document.getElementById('flowWave');if(!fw)return;
   if(matchMedia('(prefers-reduced-motion:reduce)').matches){fw.style.opacity='.12';return;}
   const footer=document.querySelector('footer');let tick=false;
   function apply(){tick=false;const sc=window.scrollY,vh=window.innerHeight;
     const prog=Math.min(1,sc/(vh*1.1));let op=.12+prog*.34;
     if(footer){const ft=footer.getBoundingClientRect().top;if(ft<vh)op*=Math.max(0,Math.min(1,ft/(vh*.7)));}
     fw.style.opacity=op.toFixed(3);}
   window.addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(apply);}},{passive:true});
   apply();
 })();



</script>
</body></html>
