services:
  infinity:
    image: michaelf34/infinity:latest
    restart: unless-stopped
    command:
      - v2
      - --model-id=BAAI/bge-m3
      - --model-id=${RERANK_MODEL:-BAAI/bge-reranker-base}
      - --port=7997
      - --api-key=${INFINITY_API_KEY:?set INFINITY_API_KEY in .env}
      # NOTE: --engine=optimum (ONNX) is intentionally omitted.
      # It attempts to AOT-compile both models simultaneously, which OOMs on t3.large (8 GB)
      # before either model is ready. The default PyTorch engine is the safe choice here.
    environment:
      HF_HOME: /models
    volumes:
      - model_cache:/models
    # Shared memory for PyTorch DataLoader workers (needed even in inference mode).
    shm_size: '1gb'
    ports:
      - "127.0.0.1:7997:7997"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # GPU node: this deployment's card was sitting mostly idle during bulk ingestion, with
    # embeddings running on CPU the whole time. Expect roughly an order of magnitude
    # improvement on rerank latency (the dominant cost in a query) and on ingestion throughput.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model_cache:

