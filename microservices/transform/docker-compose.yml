services:
  transform:
    build: .
    restart: unless-stopped
    environment:
      HF_HOME: /models
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env - both indictrans2 models are gated}
    volumes:
      - model_cache:/models
    ports:
      - "127.0.0.1:8003:8000"
    mem_limit: 2500m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  model_cache:

