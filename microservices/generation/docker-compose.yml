# Answer generation. Any OpenAI-compatible server works here (vLLM, llama.cpp, LM Studio);
# Ollama is the least painful to operate on a single node.
#
# Standalone: no dependency on any other service directory. Point the application's
# GEN_PROVIDER=local / LOCAL_GEN_URL / LOCAL_GEN_MODEL at wherever this lands.
#
# deploy.py in this directory picks the model in GEN_MODEL below based on detected hardware,
# then pulls it after the container starts (docker compose exec generation ollama pull ...).

services:
  generation:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Pin thread count to t3.xlarge physical cores. Ollama defaults to all logical
      # (hyper-threaded) cores which causes context-switching overhead on CPU inference.
      OLLAMA_NUM_THREADS: "4"
      # One request at a time on CPU; parallel requests would just time-slice the cores.
      OLLAMA_NUM_PARALLEL: "1"
      # Keep only one model loaded; prevents unload/reload churn if Ollama ever sees
      # multiple model names in requests.
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Grouped-query attention approximation - reduces memory bandwidth on CPU.
      OLLAMA_FLASH_ATTENTION: "1"
      # Keep the model warm for 30 min of idle. Without this, the model unloads after
      # 5 min and the next query takes 20-30s just for weight reload on t3.xlarge.
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama_models:/root/.ollama
    ports:
      # Host side deliberately not 11434 (Ollama's own default). Any bare `ollama serve`
      # a teammate runs on this host claims 11434 with no prompt to change it, which
      # collides with this container's port binding rather than the app.
      - "127.0.0.1:11500:11434"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_models:

