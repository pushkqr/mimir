# Vector store. Holds the chunk embeddings and serves hybrid dense + BM25 search.
#
# Standalone: this file has no dependency on any other service directory. Point the
# application's WEAVIATE_URL / WEAVIATE_GRPC_PORT / WEAVIATE_API_KEY at wherever this lands.

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    restart: unless-stopped
    command:
      - --host=0.0.0.0
      - --port=8080
      - --scheme=http
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
      # Authentication is on by default here. The upstream image ships with anonymous access
      # enabled, which is the wrong default for a database holding a department's corpus.
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:?set WEAVIATE_API_KEY in .env}
      AUTHENTICATION_APIKEY_USERS: mimir@localhost
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: mimir@localhost
      # --- Performance & stability tuning ---
      # Ingestion does not block live queries; each batch is indexed in the background.
      ASYNC_INDEXING: "true"
      # Soft cap on Go's heap, sized to the host. Without it Weaviate grows to fill available
      # RAM and gets OOM-killed by the kernel; set too low it does the opposite damage, since
      # GOMEMLIMIT does not fail fast — it makes the GC run continuously to stay under the
      # ceiling. At 3500MiB (sized for a 4 GB instance) on a 30 GB host, a bulk metadata
      # backfill pinned the heap at the cap and Weaviate began logging
      #   "skipping hnsw cleanup due to memory pressure"
      # every 5 minutes, so HNSW tombstones from each update were never reclaimed — the
      # updates created the pressure that disabled the cleanup that would have relieved it.
      # Keep this at roughly 40% of host RAM, well clear of the working set, and re-check it
      # if this stack moves to a smaller machine.
      GOMEMLIMIT: "12GiB"
      # Suppress per-object verbose logs; only warnings and above reach stdout.
      LOG_LEVEL: "warning"
    volumes:
      - weaviate_data:/var/lib/weaviate
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  weaviate_data:
