# Marathi to English translation (IndicTrans2), used for Devanagari queries and for
# translating Marathi source documents at ingestion time.
#
# Standalone: no dependency on any other service directory. Point the application's
# TRANSLATION_SERVICE_URL at wherever this lands.

services:
  translation:
    build: .
    restart: unless-stopped
    environment:
      INDICTRANS_MODEL: ${INDICTRANS_MODEL:-ai4bharat/indictrans2-indic-en-dist-200M}
      HF_HOME: /models
      # Both indictrans2 checkpoints are gated on HuggingFace; huggingface_hub reads this
      # env var automatically for authenticated downloads. Set in .env, not here.
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env - both indictrans2 models are gated}
      # TRANSLATE_MAX_TOKENS: 256 is the default in main.py, correct for the 200M model.
      # The ingestion (1B) instance should override this to 512 via its .env file.
      TRANSLATE_MAX_TOKENS: ${TRANSLATE_MAX_TOKENS:-256}
      # TRANSLATE_TORCH_DTYPE: float32 for 200M (default). Set float16 in the 1B instance .env.
      TRANSLATE_TORCH_DTYPE: ${TRANSLATE_TORCH_DTYPE:-float32}
    volumes:
      - model_cache:/models
    ports:
      - "127.0.0.1:8001:8000"
    # Hard cap: prevents the PyTorch process from OOM-killing the host on t3.small (2 GB).
    # 200M model in float32 uses ~1.2 GB; 1.8 GB leaves headroom for inference batches.
    # The 1B ingestion instance runs on a larger host and must raise this (float16 weights
    # alone are ~2 GB), so it overrides TRANSLATE_MEM_LIMIT in its own .env.
    mem_limit: ${TRANSLATE_MEM_LIMIT:-1800m}
    # GPU node: main.py already auto-detects CUDA (DEVICE = "cuda" if torch.cuda.is_available()
    # else "cpu") - this was the missing half. Without it, deploy.py's tier detection can pick
    # the larger 1B model *because* it sees a GPU, then that model runs on CPU anyway since
    # nothing ever attached the device - slower than if it had picked the smaller 200M model
    # in the first place. Comment out on a CPU-only host; the app falls back cleanly either way.
    #
    # As of this image build, torch.cuda.is_available() still reports False even with the
    # device attached ("CUDA initialization: The NVIDIA driver on your system is too old
    # (found version 12090)") - this image's pinned torch build predates this host's driver.
    # The reservation is left in for when the image is rebuilt against a newer torch; until
    # then this runs on CPU regardless, which is why TRANSLATION_TIMEOUT_S needs headroom.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  model_cache:

